version: "3.8"

services:
  # Next.js Application (Development)
  monlam-font-viewer-dev:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-monlam2024}
      NEXT_PUBLIC_APP_NAME: "Monlam Font Viewer (Dev)"
      NEXT_PUBLIC_APP_VERSION: "1.0.0-dev"
      NEXT_PUBLIC_APP_URL: "http://localhost"
    volumes:
      - ./public/fonts:/app/public/fonts
      - ./src:/app/src
    networks:
      - monlam-dev-network
    restart: unless-stopped

  # Nginx for Development (HTTP only)
  nginx-dev:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/fonts:/var/www/monlam-font-viewer/public/fonts:ro
    depends_on:
      - monlam-font-viewer-dev
    networks:
      - monlam-dev-network
    restart: unless-stopped

networks:
  monlam-dev-network:
    driver: bridge

