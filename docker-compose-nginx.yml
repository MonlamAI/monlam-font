version: "3.8"

services:
  # Next.js Application
  monlam-font-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-monlam2024}
      NEXT_PUBLIC_APP_NAME: "Monlam Font Viewer"
      NEXT_PUBLIC_APP_VERSION: "1.0.0"
      NEXT_PUBLIC_APP_URL: "https://your-domain.com"
    volumes:
      - ./public/fonts:/app/public/fonts
    networks:
      - monlam-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public/fonts:/var/www/monlam-font-viewer/public/fonts:ro
      # Add SSL certificates here
      # - ./ssl/cert.pem:/etc/ssl/certs/your-domain.crt:ro
      # - ./ssl/key.pem:/etc/ssl/private/your-domain.key:ro
    depends_on:
      - monlam-font-viewer
    networks:
      - monlam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  monlam-network:
    driver: bridge

